<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalSignage Cloud</title><style>body{font-family:Arial;background:#0f1115;color:#eee;margin:0}header{padding:20px 28px;background:#171a21;display:flex;justify-content:space-between}main{max-width:1150px;margin:25px auto;padding:0 20px}.card{background:#191d25;border:1px solid #292f3a;border-radius:14px;padding:20px;margin-bottom:18px}input,button,select{padding:11px;border-radius:8px;border:1px solid #394150;background:#111;color:#fff}button{cursor:pointer;background:#2563eb;border:0}.danger{background:#b91c1c}.row{display:flex;gap:10px;flex-wrap:wrap}.status{font-weight:bold}.online{color:#4ade80}.offline{color:#f87171}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #2a303a}a{color:#60a5fa}.media-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #2a303a}.muted{color:#9ca3af;font-size:13px}.assign{display:flex;gap:8px;align-items:center}.assign select{min-width:190px}</style></head><body><header><b>LocalSignage Cloud V2.1</b><span id="who"></span></header><main><div id="login" class="card"><h2>Login</h2><div class="row"><input id="user" value="admin"><input id="pass" type="password" value="admin123!"><button onclick="doLogin()">Connexion</button></div><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Pairing</h2><p>Génère un code de 6 chiffres à entrer dans le Player Android.</p><button onclick="pairCode()">Générer un code</button><h1 id="code"></h1><small id="exp"></small></div><div class="card"><h2>Devices</h2><button onclick="loadDevices()">Actualiser</button><div id="devices"></div></div><div class="card"><h2>Media</h2><p class="muted">Ajoute une vidéo/image par URL, ou téléverse un fichier.</p><div class="row"><input id="mname" placeholder="Nom du média"><input id="murl" style="min-width:360px" placeholder="https://.../video.mp4"><select id="mkind"><option value="video">Video</option><option value="image">Image</option></select><input id="mdur" type="number" value="10" min="1" style="width:80px"><button onclick="addUrlMedia()">Ajouter URL</button></div><div class="row" style="margin-top:10px"><input id="mfile" type="file"><button onclick="uploadMedia()">Téléverser</button></div><div id="media"></div></div><div class="card"><h2>Playlist</h2><div class="row"><input id="pname" placeholder="Nom de la playlist" value="Main Playlist"><button onclick="createPlaylist()">Créer / remplacer</button></div><p class="muted">Les médias cochés seront lus dans l'ordre affiché.</p><div id="playlistBuilder"></div><div id="playlists"></div></div><div class="card"><h2>Cloud API</h2><p><a href="/docs">Ouvrir Swagger / API Docs</a></p><p id="health"></p></div></div></main><script>let tk='';const H=()=>({Authorization:'Bearer '+tk});async function doLogin(){const username=document.getElementById('user').value;const password=document.getElementById('pass').value;let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});let j=await r.json();if(!r.ok){msg.textContent=j.detail;return}tk=j.access_token;sessionStorage.tk=tk;showApp()}function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';who.textContent='admin';loadAll()}async function pairCode(){let r=await fetch('/api/devices/pair/start',{method:'POST',headers:H()});let j=await r.json();code.textContent=j.code;exp.textContent='Expire: '+formatDateTime(j.expires_at)+' (heure Tunisie)'}function formatDateTime(iso){if(!iso)return '-';const d=new Date(iso);if(Number.isNaN(d.getTime()))return iso;return new Intl.DateTimeFormat('fr-TN',{timeZone:'Africa/Tunis',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}
async function loadDevices(){let [r,p]=await Promise.all([fetch('/api/devices',{headers:H()}),fetch('/api/playlists',{headers:H()})]);if(!r.ok)return;let a=await r.json();let pls=await p.json();let opts='<option value=\"\">-- Aucun playlist --</option>'+pls.map(x=>`<option value=\"${x.id}\">${x.name}</option>`).join('');devices.innerHTML='<table><tr><th>Device</th><th>Nom</th><th>Platform</th><th>Version</th><th>Etat</th><th>Dernier heartbeat (Tunisie)</th><th>Playlist / écran</th><th></th></tr>'+a.map(d=>`<tr><td>${d.device_id}</td><td>${d.name}</td><td>${d.platform}</td><td>${d.version}</td><td class=\"${d.online?'online':'offline'}\">${d.online?'ONLINE':'OFFLINE'}</td><td>${formatDateTime(d.last_seen)}</td><td><div class=\"assign\"><select id=\"pl-${d.device_id}\">${opts}</select><button onclick=\"assignPlaylist('${d.device_id}')\">Assigner</button></div></td><td><button class=\"danger\" onclick=\"delDevice('${d.device_id}')\">Supprimer</button></td></tr>`).join('')+'</table><p class=\"muted\">Heure affichée : Tunisie (Africa/Tunis). Actualisation automatique toutes les 10 secondes.</p>';a.forEach(d=>{let s=document.getElementById('pl-'+d.device_id);if(s)s.value=d.playlist_id==null?'':String(d.playlist_id)})}\nasync function assignPlaylist(deviceId){let s=document.getElementById('pl-'+deviceId);let playlist_id=s&&s.value?Number(s.value):null;let r=await fetch('/api/devices/'+encodeURIComponent(deviceId)+'/playlist',{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({playlist_id})});if(!r.ok){alert((await r.json()).detail||'Erreur assignment');return}loadDevices()}
async function delDevice(id){await fetch('/api/devices/'+encodeURIComponent(id),{method:'DELETE',headers:H()});loadDevices()}async function loadMedia(){let a=await fetch('/api/media',{headers:H()}).then(r=>r.json());media.innerHTML=a.length?a.map(m=>`<div class="media-item"><span><b>${m.name}</b> <span class="muted">[${m.kind}] ${m.duration}s</span><br><span class="muted">${m.url}</span></span><button class="danger" onclick="delMedia(${m.id})">Supprimer</button></div>`).join(''):'<p class="muted">Aucun média.</p>';playlistBuilder.innerHTML=a.map(m=>`<label style="display:block;padding:7px"><input type="checkbox" class="mid" value="${m.id}"> ${m.name} <span class="muted">(${m.kind})</span></label>`).join('')}async function addUrlMedia(){if(!murl.value)return;let r=await fetch('/api/media',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({name:mname.value||murl.value,url:murl.value,kind:mkind.value,duration:Number(mdur.value)||10})});if(!r.ok)alert((await r.json()).detail);else{mname.value='';murl.value='';loadMedia()}}async function uploadMedia(){let f=mfile.files[0];if(!f)return;let fd=new FormData();fd.append('file',f);fd.append('name',mname.value||f.name);fd.append('kind',mkind.value);fd.append('duration',mdur.value);let r=await fetch('/api/media/upload',{method:'POST',headers:H(),body:fd});if(!r.ok)alert((await r.json()).detail);else{mfile.value='';mname.value='';loadMedia()}}async function delMedia(id){await fetch('/api/media/'+id,{method:'DELETE',headers:H()});loadAll()}async function createPlaylist(){let ids=[...document.querySelectorAll('.mid:checked')].map(x=>Number(x.value));let name=pname.value.trim()||'Main Playlist';let existing=await fetch('/api/playlists',{headers:H()}).then(r=>r.json());let old=existing.find(x=>x.name===name);let url=old?'/api/playlists/'+old.id:'/api/playlists';let method=old?'PUT':'POST';let r=await fetch(url,{method,headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({name,media_ids:ids})});if(!r.ok)alert((await r.json()).detail);loadPlaylists()}async function loadPlaylists(){let a=await fetch('/api/playlists',{headers:H()}).then(r=>r.json());playlists.innerHTML=a.length?a.map(p=>`<div class="media-item"><span><b>${p.name}</b> — ${p.items.length} média(s)<br><span class="muted">${p.items.map(i=>i.name).join(' → ')||'vide'}</span></span></div>`).join(''):'<p class="muted">Aucune playlist.</p>'}async function checkHealth(){let j=await fetch('/health').then(r=>r.json());document.getElementById('health').textContent='API OK · '+j.version}async function loadAll(){loadDevices();loadMedia();loadPlaylists();checkHealth();setInterval(loadDevices,10000)}if(sessionStorage.tk){tk=sessionStorage.tk;showApp()}</script></body></html>
