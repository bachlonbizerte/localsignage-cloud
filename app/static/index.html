<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalSignage Cloud</title><style>body{font-family:Arial;background:#0f1115;color:#eee;margin:0}header{padding:20px 28px;background:#171a21;display:flex;justify-content:space-between}main{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#191d25;border:1px solid #292f3a;border-radius:14px;padding:20px;margin-bottom:18px}input,button{padding:11px;border-radius:8px;border:1px solid #394150;background:#111;color:#fff}button{cursor:pointer;background:#2563eb;border:0}.danger{background:#b91c1c}.row{display:flex;gap:10px;flex-wrap:wrap}.status{font-weight:bold}.online{color:#4ade80}.offline{color:#f87171}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #2a303a}</style></head><body><header><b>LocalSignage Cloud V2.0</b><span id="who"></span></header><main><div id="login" class="card"><h2>Login</h2><div class="row"><input id="user" value="admin"><input id="pass" type="password" value="admin123!"><button onclick="login()">Connexion</button></div><p id="msg"></p></div><div id="app" style="display:none"><div class="card"><h2>Pairing</h2><p>Génère un code de 6 chiffres à entrer dans le Player Android.</p><button onclick="pairCode()">Générer un code</button><h1 id="code"></h1><small id="exp"></small></div><div class="card"><h2>Devices</h2><button onclick="load()">Actualiser</button><div id="devices"></div></div><div class="card"><h2>Cloud API</h2><p><a style="color:#60a5fa" href="/docs">Ouvrir Swagger / API Docs</a></p><p id="health"></p></div></div></main><script>let tk='';async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});let j=await r.json();if(!r.ok){msg.textContent=j.detail;return}tk=j.access_token;sessionStorage.tk=tk;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';who.textContent='admin';load();health()};async function pairCode(){let r=await fetch('/api/devices/pair/start',{method:'POST',headers:{Authorization:'Bearer '+tk}});let j=await r.json();code.textContent=j.code;exp.textContent='Expire: '+j.expires_at};async function load(){let r=await fetch('/api/devices',{headers:{Authorization:'Bearer '+tk}});let a=await r.json();devices.innerHTML='<table><tr><th>Device</th><th>Nom</th><th>Platform</th><th>Version</th><th>Etat</th><th>Dernier heartbeat</th><th></th></tr>'+a.map(d=>`<tr><td>${d.device_id}</td><td>${d.name}</td><td>${d.platform}</td><td>${d.version}</td><td class="${d.online?'online':'offline'}">${d.online?'ONLINE':'OFFLINE'}</td><td>${d.last_seen||'-'}</td><td><button class="danger" onclick="del('${d.device_id}')">Supprimer</button></td></tr>`).join('')+'</table>'};async function del(id){await fetch('/api/devices/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+tk}});load()}async function health(){let j=await fetch('/health').then(r=>r.json());health.textContent='API OK · '+j.version}if(sessionStorage.tk){tk=sessionStorage.tk;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load();health()}</script></body></html>
